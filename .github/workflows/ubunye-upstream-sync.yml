# Guarantees:
#   * never force-pushes (plain `git push`, fast-forward only for upstream-main)
#   * never pushes develop / release/* / main (the App token is restricted by rulesets)
#   * never merges: it opens or updates one integration PR that needs human approval
#   * never deploys: release workflows trigger only on vX.Y.Z-ubunye.N tags
name: ubunye-upstream-sync

on:
  schedule:
    - cron: "17 3 * * *"        # daily 03:17 UTC
  workflow_dispatch: {}

# Preferred: a GitHub App token (vars.UBUNYE_SYNC_APP_ID + secrets.UBUNYE_SYNC_APP_KEY), so that
# the integration PR triggers CI and rulesets can grant the bot exactly upstream-main + integration/**.
# Fallback: GITHUB_TOKEN (PRs it opens do not trigger CI; re-run ubunye-ci manually).
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/storytold/lightcraft.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - id: app-token
        if: vars.UBUNYE_SYNC_APP_ID != ''
        uses: actions/create-github-app-token@v1   # TODO(M2): pin by SHA
        with:
          app-id: ${{ vars.UBUNYE_SYNC_APP_ID }}
          private-key: ${{ secrets.UBUNYE_SYNC_APP_KEY }}

      - uses: actions/checkout@v4   # TODO(M2): pin by SHA
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Fetch upstream
        run: |
          git config user.name  "ubunye-sync[bot]"
          git config user.email "ubunye-sync[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --tags upstream "$UPSTREAM_BRANCH"               # no --force: an existing tag is never moved
          git fetch origin upstream-main

      - name: Compare with last integrated revision
        id: cmp
        run: |
          LAST=$(jq -r .last_integrated.sha UPSTREAM_STATE.json)
          NEW=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          echo "last=$LAST" >> "$GITHUB_OUTPUT"; echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$LAST" = "$NEW" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! git merge-base --is-ancestor "$LAST" "$NEW"; then
            echo "::error::Upstream history no longer contains $LAST (rewrite?). Stopping."
            echo "rewrite=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count "$LAST..$NEW")" >> "$GITHUB_OUTPUT"

      - name: Report upstream history rewrite
        if: steps.cmp.outputs.rewrite == 'true'
        env: { GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}" }
        run: |
          gh issue create --title "Upstream history rewrite detected" --label upstream-history-rewrite \
            --body "last_integrated ${{ steps.cmp.outputs.last }} is not an ancestor of upstream ${{ steps.cmp.outputs.new }}. No changes were made."
          exit 1

      - name: Fast-forward upstream-main (no force)
        if: steps.cmp.outputs.changed == 'true'
        run: |
          git push origin "${{ steps.cmp.outputs.new }}:refs/heads/upstream-main"   # rejected unless fast-forward

      - name: Build change report
        if: steps.cmp.outputs.changed == 'true'
        run: |
          # Shared, deterministic classifier from ubunye-creative-studio-tools (features/fixes/breaking/security,
          # Cargo.lock delta, cargo-audit delta, brand drift, conflict hotspots).
          python3 -I ubunye/scripts/upstream_report.py \
            --from "${{ steps.cmp.outputs.last }}" --to "${{ steps.cmp.outputs.new }}" \
            --patched-paths ubunye/patched-paths.txt --out sync-report.md --json sync-report.json

      - name: Merge into rolling integration branch
        if: steps.cmp.outputs.changed == 'true'
        id: merge
        run: |
          BR=integration/upstream
          if git ls-remote --exit-code origin "refs/heads/$BR" >/dev/null; then
            git fetch origin "$BR"; git switch -c "$BR" "origin/$BR"
          else
            git switch -c "$BR" origin/develop
          fi
          STATUS=clean
          if ! git merge --no-ff --no-edit \
                 -m "Merge upstream ${{ steps.cmp.outputs.new }} (${{ steps.cmp.outputs.count }} commits)" \
                 "${{ steps.cmp.outputs.new }}"; then
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort                                         # never commit conflict markers
            STATUS=conflicts
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          # Record the pending outcome; it only reaches develop when a human merges the PR.
          jq --arg sha "${{ steps.cmp.outputs.new }}" --arg st "$STATUS" --arg now "$(date -u +%FT%TZ)" \
             '.last_checked_at=$now | .pending={sha:$sha, integration_branch:"integration/upstream", status:$st}' \
             UPSTREAM_STATE.json > s.json && mv s.json UPSTREAM_STATE.json
          git commit -am "Record pending upstream integration ${{ steps.cmp.outputs.new }}" || true
          git push origin "$BR"                                         # plain push, never --force

      - name: Open or update the integration PR
        if: steps.cmp.outputs.changed == 'true'
        env: { GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}" }
        run: |
          [ -f conflicts.txt ] && { echo; echo "### Conflicts (resolve locally, then push to this branch)"; sed 's/^/- /' conflicts.txt; } >> sync-report.md
          if gh pr view integration/upstream --json number >/dev/null 2>&1; then
            gh pr edit integration/upstream --body-file sync-report.md
          else
            gh pr create --base develop --head integration/upstream \
              --title "Upstream integration: ${{ steps.cmp.outputs.count }} commits up to ${{ steps.cmp.outputs.new }}" \
              --label upstream-sync --body-file sync-report.md
          fi
          # Required checks (ubunye-ci, deny, smoke, brand-leak) run on the PR; merge requires approval.
