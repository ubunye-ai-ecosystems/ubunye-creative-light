# Ubunye identity for Ubunye Light (repo: ubunye-creative-light). Single source of truth for the brand layer.
# ubunye/brand/apply.py reads this file: it generates crates/engine/src/brand.rs from it and uses
# it for every scripted replacement. Change a value here, then run `python -I ubunye/brand/apply.py`.
[product]
name = "Ubunye Light"                                       # the ONE place the product name is set
short_name = "Light"
slug = "ubunye-creative-light"
suite = "Ubunye Creative Studio"
distributor = "ThabangVision"
vendor = "Ubunye AI Ecosystems"
description = "RAW photo library and development"
license = "MIT OR Apache-2.0"
# Plain-text credit (no ArtCraft marks). Shown in About, the README and the website.
based_on = "Based on LightCraft by the ArtCraft team"

[identifiers]
app_id = "org.ubunye.creative.light"                         # macOS bundle id, Linux app id, Flatpak id, config folder
document_uti = "org.ubunye.creative.light.document"
windows_upgrade_code = "9210D947-FF7A-4C2A-817A-EE355C6A0E4F"  # from studio-tools/brand/identities.toml; never reuse upstream's GUID
# Kept as upstream for now (merge cost): LIGHTCRAFT_* environment variables, crate and binary names.
env_prefix = "LIGHTCRAFT"

[links]
homepage = "https://www.thabangvision.com/tools/light"
suite = "https://www.thabangvision.com/tools"
downloads = "https://downloads.thabangvision.com/light/stable/"
source = "https://github.com/ubunye-ai-ecosystems/ubunye-creative-light"
issues = "https://github.com/ubunye-ai-ecosystems/ubunye-creative-light/issues"
upstream = "https://github.com/storytold/lightcraft"

[upstream_identity_to_replace]
names = ["LightCraft", "ArtCraft"]
app_id = "ai.storyteller.lightcraft"
vendor = "Learning Machines LLC"
links = ["getartcraft.com", "discord.gg/artcraft", "github.com/storytold/lightcraft"]
