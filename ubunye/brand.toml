# Ubunye identity for Ubunye Creative Light. Single source of truth for Milestone 4 (branding).
# Values are not wired into the build yet; branding changes start only after brand-kit approval.
[product]
name = "Ubunye Creative Light"
short_name = "Light"
slug = "ubunye-creative-light"
suite = "Ubunye Creative Studio"
vendor = "Ubunye AI Ecosystems"
description = "RAW photo library and development"
based_on = "Based on LightCraft by the ArtCraft team (https://github.com/storytold/lightcraft), used under MIT OR Apache-2.0."

[identifiers]
app_id = "org.ubunye.creative.light"                         # macOS bundle id, Linux app id, Flatpak id
document_uti = "org.ubunye.creative.light.document"
windows_upgrade_code = "9210D947-FF7A-4C2A-817A-EE355C6A0E4F"         # generated for Ubunye; never reuse upstream's GUID
env_prefix = "UBUNYE_LIGHT"                    # replaces upstream's LIGHTCRAFT_* variables
config_dir = "ubunye-creative-light"

[links]
homepage = "https://thabangvision.com/studio/light"
downloads = "https://downloads.thabangvision.com/light/"
web_app = "https://light.studio.thabangvision.com/"
source = "https://github.com/ubunye-ai-ecosystems/ubunye-creative-light"
issues = "https://github.com/ubunye-ai-ecosystems/ubunye-creative-light/issues"
update_manifest = "https://downloads.thabangvision.com/manifests/light/stable.json"

[upstream_identity_to_replace]
names = ["LightCraft", "ArtCraft"]
app_id = "ai.storyteller.lightcraft"
vendor = "Learning Machines LLC"
links = ["getartcraft.com", "discord.gg/artcraft", "github.com/storytold/lightcraft"]
